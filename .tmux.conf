# TMUX OPTIONS
# ============

# Remap prefix from 'C-b' to 'C-s'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Split panes using h and v and inherit current pane's working directory
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows inherit current pane's working directory
bind c new-window -c "#{pane_current_path}"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using vim-bindings without prefix
bind -n C-h select-pane -L
bind -n C-l select-pane -R
bind -n C-k select-pane -U
bind -n C-j select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# don't rename windows automatically
set-option -g allow-rename off

# Fix Colors for neovim
set-option -ga terminal-overrides ",xterm-256color:Tc"

# TMUX PLUGINS
# ============

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# DESIGN TWEAKS
# =============
# Tokyonight Storm palette (reference)
#   bg          #1f2335   bg_highlight  #292e42   fg      #c0caf5
#   comment/dim #565f89   border(dim)   #3b4261
#   blue        #7aa2f7   cyan          #7dcfff   magenta #bb9af7
#   green       #9ece6a   yellow        #e0af68   red     #f7768e
#
# NOTE: tmux only controls text color/weight, never the font family itself.
# Set "JetBrainsMono Nerd Font" (bold) in your terminal emulator's profile.
# The pill caps below (the round glyphs) require the Nerd Font patched
# variant - plain JetBrains Mono will show boxes/blanks instead.

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour '#7aa2f7'

# copy mode
setw -g mode-style 'fg=#1f2335 bg=#9ece6a bold'

# panes
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-interval 1
set -g status-style 'bold,fg=#c0caf5,bg=default'

# session pill (left)
set -g status-left-length 30
set -g status-left "#[fg=#9ece6a,bg=default]#[fg=#1f2335,bg=#9ece6a,bold]  #S #[fg=#9ece6a,bg=default] "

# date + time pills (right)
set -g status-right-length 60
set -g status-right "#[fg=#7dcfff,bg=default]#[fg=#1f2335,bg=#7dcfff,bold]  %Y-%m-%d #[fg=#7dcfff,bg=default] #[fg=#bb9af7,bg=default]#[fg=#1f2335,bg=#bb9af7,bold]  %H:%M #[fg=#bb9af7,bg=default]"

# current window: filled pill
setw -g window-status-current-format "#[fg=#7aa2f7,bg=default]#[fg=#1f2335,bg=#7aa2f7,bold] #I:#W #[fg=#7aa2f7,bg=default]"

# inactive windows: plain, muted, sit flat on the bar
setw -g window-status-style 'fg=#565f89'
setw -g window-status-format ' #I:#W '
set -g window-status-separator ''

setw -g window-status-bell-style 'fg=#1f2335 bg=#f7768e bold'

# messages
set -g message-style 'fg=#1f2335 bg=#e0af68 bold'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
